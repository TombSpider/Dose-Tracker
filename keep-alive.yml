name: Keep Supabase Awake

on:
  schedule:
    - cron: '0 12 */3 * *'   # every 3 days at 12:00 UTC — buffer under the 7-day pause window
  workflow_dispatch:          # lets you trigger it manually from the Actions tab too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          curl -s -o /dev/null -w "%{http_code}" "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
