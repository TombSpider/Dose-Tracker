<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Dose &amp; Test Log</title>
<meta name="theme-color" content="#1D2B3A">
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --paper:#FAF8F3; --paper-line:#E4DFD2; --ink:#1D2B3A; --ink-soft:#4B5A68;
    --teal:#3E7C7C; --teal-dark:#2C5C5C; --amber:#C88B3D; --beige:#E8DEC8;
    --gray:#8A8F98; --danger:#B5533C; --radius:10px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding-bottom:50px;}
  .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;}
  a{color:var(--teal-dark);}

  header{padding:18px 16px 10px; border-bottom:1px solid var(--paper-line); position:sticky; top:0; background:var(--paper); z-index:10;}
  .eyebrow{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--teal-dark); font-weight:600; margin-bottom:2px;}
  h1{margin:0; font-size:20px; font-weight:650;}
  .navbar{display:flex; gap:6px; margin-top:12px; flex-wrap:wrap;}
  .navbtn{font-size:12px; padding:6px 10px; border-radius:20px; border:1px solid var(--paper-line); background:#fff; color:var(--ink-soft); cursor:pointer; font-weight:600;}
  .navbtn.active{background:var(--teal); color:#fff; border-color:var(--teal);}
  .signout{font-size:11px; color:var(--gray); cursor:pointer; margin-left:auto;}

  main{padding:16px 14px 0;}
  .card{background:#fff; border:1px solid var(--paper-line); border-radius:var(--radius); padding:14px; margin-bottom:16px;}
  .card h2{font-size:12.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--teal-dark); margin:0 0 10px; font-weight:650;}
  label{display:block; font-size:12px; color:var(--ink-soft); margin:10px 0 4px; font-weight:600;}
  label:first-of-type{margin-top:0;}
  input[type="text"], input[type="number"], input[type="date"], input[type="datetime-local"],
  input[type="email"], input[type="password"], textarea, select{
    width:100%; padding:9px 11px; border:1px solid #D8D2C2; border-radius:8px; font-size:15px; background:#FDFCF9; color:var(--ink); font-family:inherit;
  }
  input:focus, textarea:focus, select:focus{outline:none; border-color:var(--teal);}
  .row{display:flex; gap:8px;}
  .row > div{flex:1;}
  textarea{resize:vertical; min-height:50px;}
  .checkbox-row{display:flex; align-items:center; gap:8px; margin-top:10px;}
  .checkbox-row input{width:auto;}
  .checkbox-row label{margin:0; font-size:13px;}
  .hint{font-size:11.5px; color:var(--gray); margin-top:3px;}

  .status-picker{display:flex; gap:6px; margin-top:4px;}
  .status-opt{flex:1; padding:8px 4px; border:1px solid #D8D2C2; border-radius:8px; text-align:center; font-size:17px; cursor:pointer; background:#FDFCF9;}
  .status-opt.active{border-color:var(--teal); background:#EBF3F1;}

  .btn{display:block; width:100%; padding:12px; border:none; border-radius:8px; font-size:15px; font-weight:650; cursor:pointer; margin-top:12px; background:var(--teal); color:#fff;}
  .btn:active{background:var(--teal-dark);}
  .btn.secondary{background:transparent; color:var(--ink-soft); border:1px solid var(--paper-line); font-weight:500;}
  .btn.danger{background:transparent; color:var(--danger); border:1px solid var(--danger); font-weight:600;}
  .btn.small{padding:8px; font-size:13px; margin-top:8px;}
  .btn:disabled{opacity:0.5;}

  .supp-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px;}
  .supp-btn{display:flex; border-radius:10px; overflow:hidden; border:1px solid var(--paper-line); height:58px;}
  .supp-btn-left{flex:0 0 62%; background:#fff; display:flex; align-items:center; padding:0 10px; cursor:pointer;}
  .supp-btn-right{flex:1; background:var(--beige); display:flex; align-items:center; justify-content:center; cursor:pointer; border-left:1px solid var(--paper-line);}
  .supp-name{font-size:13.5px; font-weight:650; line-height:1.2;}
  .supp-dose{font-size:13px; font-weight:650; color:var(--teal-dark);}
  .supp-btn.add{border:1px dashed var(--gray); background:transparent; align-items:center; justify-content:center; color:var(--gray); font-size:13px; font-weight:600;}

  .filter-toggle{font-size:12px; color:var(--teal-dark); font-weight:650; cursor:pointer; margin:8px 0 0; display:inline-block;}
  .filter-panel{margin-top:10px; padding-top:10px; border-top:1px solid var(--paper-line); display:none;}
  .filter-panel.open{display:block;}
  .filter-group-title{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--gray); font-weight:650; margin:10px 0 6px;}
  .chip-row{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{font-size:12px; padding:5px 10px; border-radius:16px; border:1px solid var(--paper-line); background:#fff; cursor:pointer; display:flex; align-items:center; gap:5px;}
  .chip.active{border-color:var(--teal);}
  .chip .swatch{width:8px; height:8px; border-radius:50%;}
  .daterange-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}

  .legend{display:flex; flex-wrap:wrap; gap:10px; margin-top:8px; font-size:11.5px; color:var(--ink-soft);}
  .legend-item{display:flex; align-items:center; gap:5px;}
  .legend .swatch{width:9px; height:9px; border-radius:50%;}

  .list-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--paper-line);}
  .list-row:last-child{border-bottom:none;}
  .list-row-main{font-size:14px; font-weight:600;}
  .list-row-sub{font-size:12px; color:var(--gray); margin-top:2px;}
  .list-actions{display:flex; gap:10px; font-size:12px;}
  .list-actions span{cursor:pointer; color:var(--teal-dark); font-weight:600;}
  .list-actions span.del{color:var(--danger);}

  .timeline{position:relative; padding-left:18px; margin-top:6px;}
  .timeline::before{content:''; position:absolute; left:4px; top:5px; bottom:5px; width:1px; background:var(--paper-line);}
  .entry{position:relative; margin-bottom:14px; cursor:pointer;}
  .entry::before{content:''; position:absolute; left:-18px; top:4px; width:8px; height:8px; border-radius:50%; background:var(--teal); border:2px solid var(--paper);}
  .entry-head{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .entry-dose{font-size:14.5px; font-weight:650;}
  .entry-time{font-size:11.5px; color:var(--gray);}
  .entry-notes{font-size:13px; color:var(--ink-soft); margin-top:2px;}
  .day-divider{font-size:11px; color:var(--gray); text-transform:uppercase; letter-spacing:.06em; margin:16px 0 8px -18px; padding-left:18px; font-weight:650;}

  .metric-row{border:1px solid var(--paper-line); border-radius:8px; padding:10px; margin-bottom:8px; background:#FDFCF9;}
  .metric-row-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
  .metric-row-header span{font-size:11px; color:var(--gray); font-weight:650; text-transform:uppercase;}
  .remove-row{font-size:11px; color:var(--danger); cursor:pointer; font-weight:600;}

  .tabs{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
  .tab{flex:1; min-width:90px; text-align:center; padding:8px; border-radius:8px; font-size:12.5px; font-weight:650; cursor:pointer; border:1px solid var(--paper-line); background:#fff; color:var(--ink-soft);}
  .tab.active{background:var(--teal); color:#fff; border-color:var(--teal);}

  .empty{text-align:center; padding:24px 16px; color:var(--gray); font-size:13px; border:1px dashed var(--paper-line); border-radius:var(--radius);}

  .settings-row{display:flex; gap:14px; justify-content:center; font-size:12px; margin:18px 0 6px; color:var(--gray);}
  .settings-row a{color:var(--teal-dark); font-weight:600; cursor:pointer;}

  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:#fff; padding:10px 18px; border-radius:20px; font-size:13px; opacity:0; transition:all .25s; pointer-events:none; z-index:100; max-width:85vw; text-align:center;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .back-link{font-size:13px; color:var(--teal-dark); font-weight:600; cursor:pointer; display:inline-block; margin-bottom:10px;}

  table.review{width:100%; border-collapse:collapse; font-size:12px; margin-top:10px;}
  table.review th{text-align:left; font-size:10px; text-transform:uppercase; color:var(--gray); padding:4px; border-bottom:1px solid var(--paper-line);}
  table.review td{padding:5px 4px; border-bottom:1px solid var(--paper-line); vertical-align:top;}
  table.review input{padding:4px 6px; font-size:12px;}
  .stat-block{margin-bottom:22px;}
  .stat-block h3{font-size:13px; margin:0 0 8px; font-weight:650;}
  .r-value{font-size:22px; font-weight:700; color:var(--teal-dark);}
  .center{text-align:center;}
  .loading-screen{padding:60px 20px; text-align:center; color:var(--gray); font-size:14px;}
</style>
</head>
<body>

<div id="authScreen" style="display:none;"></div>

<div id="mainApp" style="display:none;">
  <header>
    <div class="eyebrow">Personal Health Log</div>
    <div style="display:flex; align-items:baseline;">
      <h1>Dose &amp; Test Log</h1>
      <span class="signout" onclick="signOut()">Sign out</span>
    </div>
    <div class="navbar" id="navbar"></div>
  </header>
  <main id="app"></main>
</div>

<div id="loadingScreen" class="loading-screen">Loading…</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
